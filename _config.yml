# Site-wide settings for Junteng Liu's personal homepage
locale: "en-US"
site_theme: "default"

title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Junteng Liu is a first-year PhD candidate at HKUST NLP Group focusing on natural language processing and machine learning."

url: "https://lancerarouse.github.io"
baseurl: "/LJT-Homepage"
repository: "LancerArouse/LJT-Homepage"

# Site author information from personal memory
author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

twitter:
  username: "junteng88716710"

social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"

# Publication categories retained for the AcademicPages theme
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Site settings
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
teaser:

comments:
  provider:
  disqus:
    shortname:
  discourse:
    server:
  facebook:
    appid:
    num_posts: 5
    colorscheme: "dark"

atom_feed:
  hide: true
  path:

# Analytics are not configured in memory.
analytics:
  provider: "false"
  google:
    tracking_id:

# Reading files
include:
  - ".htaccess"
  - "_pages"

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - ".asset-cache"
  - ".bundle"
  - ".jekyll-assets-cache"
  - ".sass-cache"
  - ".github"
  - "CHANGELOG"
  - "Capfile"
  - "config"
  - "Dockerfile"
  - "Gemfile"
  - "Gruntfile.js"
  - "gulpfile.js"
  - "LICENSE"
  - "local"
  - "log"
  - "node_modules"
  - "package.json*"
  - "Rakefile"
  - "README"
  - "tmp"
  - "vendor"
  # Template sample collections and non-requested sample content
  - "_drafts"
  - "_publications"
  - "_talks"
  - "_teaching"
  - "_portfolio"
  - "_posts"
  - "files"
  - "talkmap"
  - "markdown_generator"
  - "scripts"
  - "talkmap.ipynb"
  - "talkmap.py"
  - "talkmap_out.ipynb"
  - "AGENTS.md"
  - "docker-compose.yaml"
  - "images/profile.png"
  - "images/bio-photo.jpg"
  - "images/bio-photo-2.jpg"
  - "images/editing-talk.png"
  - "images/500x300.png"
  - "_pages/archive-layout-with-content.md"
  - "_pages/cv.md"
  - "_pages/markdown.md"
  - "_pages/non-menu-page.md"
  - "_pages/portfolio.html"
  - "_pages/talks.html"
  - "_pages/teaching.html"
  - "_pages/talkmap.html"
  - "_pages/year-archive.html"
  - "_pages/terms.md"
  - "_pages/category-archive.html"
  - "_pages/collection-archive.html"
  - "_pages/page-archive.html"
  - "_pages/tag-archive.html"
  - "_pages/sitemap.md"

keep_files:
  - ".git"
  - ".svn"

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
