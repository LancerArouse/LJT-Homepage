# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Validate Jekyll build
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Personal Details" _site/index.html
          grep -q "Academic Background" _site/index.html
          grep -q "Research Experience" _site/index.html
          grep -q "Skills and Research Expertise" _site/index.html
          grep -q "Contact Information" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -q "In-Context Sharpness as Alerts" _site/index.html
          grep -q "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "tbK9jl4AAAAJ" _site/index.html
          grep -q "junteng88716710" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "Vision4Chart" _site/publications/index.html
          grep -q "Universal_Truthfulness_Hyperplane" _site/publications/index.html
          if grep -R -q "Paper Title Number" _site; then
            echo "Demo publication content remains in generated site" >&2
            exit 1
          fi
          if find _site -path '*/talks/*' -o -path '*/teaching/*' -o -path '*/portfolio/*' | grep -q .; then
            echo "Unexpected sample collection output remains in generated site" >&2
            exit 1
          fi
          find _site -maxdepth 2 -type f | sort | head -100
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
